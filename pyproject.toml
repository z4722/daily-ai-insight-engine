[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
  "outputs",
  "data",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
]
ignore = [
  "E501", # line length handled by formatter/editor
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
